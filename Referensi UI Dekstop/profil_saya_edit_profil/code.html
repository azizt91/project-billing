</button>

</div>
<!-- Email / Username -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email / Username</label>
<input class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-white text-on-background focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow font-body-md text-body-md placeholder-secondary-fixed-dim" id="email" type="email" value="budi.santoso@example.com"/>
